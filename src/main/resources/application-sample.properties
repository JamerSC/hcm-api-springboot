# JWT Secret Key (a long, random, and secure string)
# You can generate one with a command like: `openssl rand -base64 64`
# https://www.devglan.com/online-tools/hmac-sha256-online?ref=blog.tericcabrel.com
#example
#security.jwt.secret.key=3b72fea6335b48e7813847e2ee510731a25a15e326fd41c0540a123ac7faccb0
# JWT Expiration Time (e.g., 24 hours) in milliseconds
#security.jwt.expiration.time=86400000

security.jwt.secret.key=${JWT_SECRET_KEY:3b72fea6335b48e7813847e2ee510731a25a15e326fd41c0540a123ac7faccb0}
security.jwt.expiration.time=${JWT_EXP_TIME:86400000}
hashids.salt=${HASHIDS_SALT:HCMSystemSecretSalt2026!#}
hashids.min-length=${HASHIDS_LENGTH:10}
hashids.alphabet=${HASHIDS_ALPHABET:abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890}

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
# http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
# http://localhost:8080/api-docs or api-docs/yaml

# src/main/resources/application.properties
# Spring Mail Properties
