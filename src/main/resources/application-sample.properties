# File Storage Configuration
file.upload-dir=./uploads/resumes/
file.max-size-mb=5

# ========== LOGGING CONFIGURATION ==========

# Log level (DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.test=DEBUG

# Log output patterns (like Laravel format)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File logging
logging.file.name=logs/test-api.log

# Log file rotation (daily, max size)
logging.logback.rollingpolicy.file-name-pattern=logs/test-api-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30